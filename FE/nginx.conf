server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Declared once at server level so every location below inherits it.
    root /usr/share/nginx/html;

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # index.html is the 849-byte file that names the hashed bundles, and its URL
    # never changes. Served without Cache-Control, browsers invent their own
    # freshness window and keep pointing at the previous build until someone
    # presses Ctrl+F5. "no-cache" means "reuse it, but ask me first" — a
    # conditional request that answers 304 when nothing changed.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite puts a content hash in each asset filename, so one URL always means
    # one exact file. Those can be cached for as long as the browser likes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
} 